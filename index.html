<!doctype html>
<!--
GUPSHUP: single-file chat app. Upload this one file as index.html to a GitHub repo.

SETUP
1. console.firebase.google.com: create a project.
2. Build > Authentication > Sign-in method > Google > Enable (choose a support email) > Save.
3. Build > Firestore Database > Create database (production mode).
4. Firestore > Rules tab: replace everything with the rules at the bottom of this comment, then Publish.
5. Project settings > Your apps > Web: copy the config into the FIREBASE_CONFIG block in this file.
6. GitHub repo > Settings > Pages > Deploy from a branch > main, / (root).
7. Firebase > Authentication > Settings > Authorized domains: add YOUR-USERNAME.github.io

NOTE: anyone with the link can join and read every chat, including one-to-one chats.

FIRESTORE RULES (paste into Firebase, step 4)
rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {

    function signedIn() {
      return request.auth != null;
    }

    // Display names. Each person writes only their own.
    match /people/{uid} {
      allow read: if signedIn();
      allow write: if signedIn() && request.auth.uid == uid;
    }

    // Typing indicators.
    match /typing/{uid} {
      allow read: if signedIn();
      allow write: if signedIn() && request.auth.uid == uid;
    }

    // Private per-person data (which chats are read).
    match /data/users/{uid}/{document=**} {
      allow read, write: if signedIn() && request.auth.uid == uid;
    }

    // Chats. Anyone signed in can see and start chats.
    // After creation only the "last message" preview can change.
    match /rooms/{roomId} {
      allow read: if signedIn();
      allow create: if signedIn();
      allow update: if signedIn()
        && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['last']);

      match /messages/{msgId} {
        allow read: if signedIn();
        allow create: if signedIn() && request.resource.data.from == request.auth.uid;
        allow update: if signedIn() && resource.data.from == request.auth.uid;
      }
    }
  }
}
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Gupshup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: chat list rail on the left, conversation on the right; on phones one pane at a time. */
:root{
  --bg:#e7edea;
  --side:#ffffff;
  --side-2:#f1f5f3;
  --chat-bg:#e3ebe7;
  --dot:rgba(15,70,58,.08);
  --in:#ffffff;
  --out:#d2f1e0;
  --fg:#10201e;
  --muted:#5b706d;
  --line:#dbe4e1;
  --brand:#0f7b6c;
  --brand-ink:#ffffff;
  --pop:#17b383;
  --shadow:0 1px 1px rgba(10,35,30,.14);
  --scrim:rgba(5,18,16,.5);
  --font-display:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#091214;
    --side:#0f1b1e;
    --side-2:#162629;
    --chat-bg:#0b1517;
    --dot:rgba(120,225,195,.055);
    --in:#17272b;
    --out:#0e5b4b;
    --fg:#e4efed;
    --muted:#8aa09d;
    --line:#1e3135;
    --brand:#2bbfa3;
    --brand-ink:#04201b;
    --pop:#2bd49d;
    --shadow:0 1px 1px rgba(0,0,0,.35);
    --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#091214;
  --side:#0f1b1e;
  --side-2:#162629;
  --chat-bg:#0b1517;
  --dot:rgba(120,225,195,.055);
  --in:#17272b;
  --out:#0e5b4b;
  --fg:#e4efed;
  --muted:#8aa09d;
  --line:#1e3135;
  --brand:#2bbfa3;
  --brand-ink:#04201b;
  --pop:#2bd49d;
  --shadow:0 1px 1px rgba(0,0,0,.35);
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
html{box-sizing:border-box;height:100%}
body{height:100%;background:var(--bg);color:var(--fg);font:15px/1.4 var(--font-body);overflow:hidden}
*,*::before,*::after{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(320px,380px) minmax(0,1fr);background:var(--side)}
.side{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--side);border-right:1px solid var(--line)}
.pane{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--chat-bg)}

/* sidebar */
.side-head{display:flex;align-items:center;gap:12px;padding:12px 16px}
.brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0;color:var(--brand)}
.brand svg{width:28px;height:28px;flex:none}
.brand b{font:700 22px/1 var(--font-display);letter-spacing:-.02em;color:var(--fg)}
.icon-btn{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;color:var(--fg);flex:none}
.icon-btn:hover{background:var(--side-2)}
.icon-btn svg{width:22px;height:22px}
.search{padding:0 16px 10px}
.search input{width:100%;padding:10px 14px;border-radius:12px;border:1px solid transparent;background:var(--side-2);outline:0}
.search input:focus{border-color:var(--brand)}
.search input::placeholder{color:var(--muted)}
.chat-list{flex:1;min-height:0;overflow-y:auto;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;align-items:center;width:100%;padding:10px 16px;text-align:left}
.row:hover{background:var(--side-2)}
.row.on{background:var(--side-2)}
.row-main{min-width:0;display:flex;flex-direction:column;gap:2px}
.row-top,.row-bot{display:flex;align-items:center;gap:8px;min-width:0}
.row-top b{flex:1;min-width:0;font:600 16px/1.2 var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-top time{font-size:12px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.row.unread .row-top time{color:var(--pop);font-weight:600}
.row-bot span{flex:1;min-width:0;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.unread .row-bot span{color:var(--fg);font-weight:500}
.dot{width:10px;height:10px;border-radius:50%;background:var(--pop);flex:none}
.empty-list{padding:32px 24px;display:flex;flex-direction:column;gap:6px;color:var(--muted)}
.empty-list .t{font:600 17px/1.2 var(--font-display);color:var(--fg);margin:0}
.empty-list p{margin:0;max-width:34ch}

.av{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font:600 17px/1 var(--font-display);object-fit:cover;background:var(--muted);overflow:hidden}
.av.sm{width:36px;height:36px;font-size:14px}

/* conversation pane */
.pane-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:32px 24px;text-align:center;color:var(--muted);background-color:var(--chat-bg);background-image:radial-gradient(var(--dot) 1.3px,transparent 1.5px);background-size:22px 22px}
.pane-empty svg{width:72px;height:72px;color:var(--brand)}
.pane-empty h1{margin:0;font:700 30px/1.1 var(--font-display);letter-spacing:-.02em;color:var(--fg)}
.pane-empty p{margin:0;max-width:44ch}
.pane-empty .fine{font-size:13px;max-width:48ch}
.thread{flex:1;min-height:0;display:flex;flex-direction:column}
.thread[hidden]{display:none}
.thread-head{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--side);border-bottom:1px solid var(--line)}
.thread-head .back{display:none}
.head-text{min-width:0;display:flex;flex-direction:column}
.head-text b{font:600 17px/1.2 var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head-text span{font-size:13px;color:var(--muted)}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:2px;background-color:var(--chat-bg);background-image:radial-gradient(var(--dot) 1.3px,transparent 1.5px);background-size:22px 22px}
.hint{margin:auto;padding:8px 14px;border-radius:12px;background:var(--side);color:var(--muted);font-size:13px;box-shadow:var(--shadow)}
.day{align-self:center;margin:12px 0 8px;padding:4px 12px;border-radius:999px;background:var(--side);color:var(--muted);font-size:12px;font-weight:500;box-shadow:var(--shadow)}
.m{display:flex}
.m.out{justify-content:flex-end}
.m.first{margin-top:8px}
.bubble{display:flow-root;max-width:min(80%,560px);min-width:0;padding:7px 10px 6px;border-radius:14px;background:var(--in);box-shadow:var(--shadow);overflow-wrap:anywhere;cursor:pointer;text-align:left}
.m.out .bubble{background:var(--out)}
.m.first:not(.out) .bubble{border-top-left-radius:4px}
.m.first.out .bubble{border-top-right-radius:4px}
.bubble.sel{outline:2px solid var(--brand);outline-offset:1px}
.bubble .who{font:600 13px/1.2 var(--font-display);margin-bottom:2px}
.bubble .txt{white-space:pre-wrap}
.bubble .txt a{color:var(--brand);text-decoration:underline}
.bubble.gone .txt{color:var(--muted);font-style:italic}
.meta{float:right;margin:7px 0 -2px 12px;display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.meta svg{width:16px;height:11px;color:var(--brand)}
.meta .wait{opacity:.5}
.selbar{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--side);border-top:1px solid var(--line)}
.selbar .grow{flex:1;color:var(--muted);font-size:13px}
.chip{padding:8px 14px;border-radius:999px;background:var(--side-2);font-weight:500}
.chip:hover{background:var(--line)}
.chip.danger{color:#c0362c}
:root[data-theme="dark"] .chip.danger{color:#ff8f86}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.danger{color:#ff8f86}}
.emoji{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:2px;padding:8px 16px;background:var(--side);border-top:1px solid var(--line);max-height:168px;overflow-y:auto}
.emoji button{font-size:22px;line-height:1;padding:6px;border-radius:8px}
.emoji button:hover{background:var(--side-2)}
.composer{display:flex;align-items:flex-end;gap:8px;padding:10px 16px;background:var(--side);border-top:1px solid var(--line)}
.composer textarea{flex:1;min-width:0;max-height:140px;resize:none;padding:11px 16px;border-radius:22px;border:1px solid transparent;background:var(--side-2);outline:0;line-height:1.35}
.composer textarea:focus{border-color:var(--brand)}
.composer textarea::placeholder{color:var(--muted)}
.composer textarea:disabled{opacity:.6}
.send{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--brand);color:var(--brand-ink);flex:none}
.send:disabled{opacity:.4;cursor:default}
.send svg{width:22px;height:22px}

/* new chat sheet */
.scrim{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim)}
.sheet{width:min(440px,100%);max-height:86%;display:flex;flex-direction:column;background:var(--side);border-radius:18px 18px 0 0;overflow:hidden}
@media (min-width:761px){.scrim{align-items:center}.sheet{border-radius:18px;max-height:80%}}
.sheet-head{display:flex;align-items:center;gap:8px;padding:12px 8px 8px 16px}
.sheet-head h2{flex:1;margin:0;font:700 20px/1.2 var(--font-display)}
.sheet .search{padding-top:4px}
.sheet-list{overflow-y:auto;min-height:60px;padding-bottom:12px}
.group-btn{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;align-items:center;width:100%;padding:10px 16px;text-align:left;font:600 16px/1.2 var(--font-display)}
.group-btn:hover{background:var(--side-2)}
.group-btn .av{background:var(--brand);color:var(--brand-ink)}
.group-btn .av svg{width:24px;height:24px}
.sheet h3{margin:8px 16px 4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.group-form{display:flex;flex-direction:column;gap:12px;padding:8px 16px 18px}
.group-form label{font-size:13px;color:var(--muted)}
.group-form input{padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--side-2);outline:0}
.group-form input:focus{border-color:var(--brand)}
.primary{padding:12px 18px;border-radius:12px;background:var(--brand);color:var(--brand-ink);font-weight:600}
.primary:disabled{opacity:.45;cursor:default}

.thread-head .grow{flex:1;min-width:0}
.head-text span.typing{color:var(--brand);font-weight:500}
.quote{display:block;width:100%;margin:0 0 5px;padding:5px 8px;border-radius:8px;background:color-mix(in srgb,var(--fg) 8%,transparent);border-left:3px solid var(--brand);font-size:13px;line-height:1.3;cursor:pointer;text-align:left}
.quote b{display:block;font:600 12px/1.2 var(--font-display);margin-bottom:1px}
.quote span{color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pic{display:block;width:320px;max-width:100%;height:auto;border-radius:10px;margin:1px 0 4px;cursor:zoom-in;background:var(--side-2)}
.m.flash .bubble{outline:2px solid var(--brand);outline-offset:1px}
.topbar{display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--side);border-top:1px solid var(--line)}
.topbar .qt{flex:1;min-width:0;padding:6px 10px;border-left:3px solid var(--brand);border-radius:6px;background:var(--side-2);font-size:13px}
.topbar .qt b{display:block;font:600 12px/1.2 var(--font-display)}
.topbar .qt span{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar img{width:48px;height:48px;border-radius:8px;object-fit:cover;flex:none}
.lightbox{flex-direction:column;gap:12px;align-items:center;justify-content:center;padding:16px}
.lightbox img{max-width:100%;max-height:78%;border-radius:10px;object-fit:contain}
.lb-actions{display:flex;gap:8px}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:30;max-width:min(92vw,420px);padding:10px 16px;border-radius:12px;background:var(--fg);color:var(--side);font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.25)}

@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .app[data-view="list"] .pane{display:none}
  .app[data-view="thread"] .side{display:none}
  .thread-head .back{display:grid;margin-left:-8px}
  .bubble{max-width:86%}
}
@media (prefers-reduced-motion:no-preference){
  .bubble{animation:pop .14s ease-out}
  @keyframes pop{from{transform:translateY(4px);opacity:.4}to{transform:none;opacity:1}}
}
</style>


</head>
<body>
<div class="app" id="app" data-view="list">
  <aside class="side">
    <header class="side-head">
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M5 7a4 4 0 0 1 4-4h11a4 4 0 0 1 4 4v6a4 4 0 0 1-4 4h-5l-5 4v-4H9a4 4 0 0 1-4-4z"/><path fill="currentColor" opacity=".5" d="M26 12h.5a3.5 3.5 0 0 1 3.5 3.5v5a3.5 3.5 0 0 1-3.5 3.5H25v3l-4-3h-6.5a3.5 3.5 0 0 1-3.2-2.1c1-.2 1.8-.5 2.4-.9H21a4 4 0 0 0 4-4z"/></svg>
        <b>Gupshup</b>
      </div>
      <button class="icon-btn" id="newBtn" type="button" aria-label="New chat" title="New chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h8"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      </button>
      <div id="me" aria-hidden="true"></div>
    </header>
    <div class="search"><input id="q" type="search" placeholder="Search chats" autocomplete="off" aria-label="Search chats"></div>
    <div class="chat-list" id="chatList">
      <div class="empty-list"><p class="t">Connecting…</p><p>Your chats will appear here.</p></div>
    </div>
  </aside>

  <main class="pane">
    <div class="pane-empty" id="paneEmpty">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M5 7a4 4 0 0 1 4-4h11a4 4 0 0 1 4 4v6a4 4 0 0 1-4 4h-5l-5 4v-4H9a4 4 0 0 1-4-4z"/><path fill="currentColor" opacity=".5" d="M26 12h.5a3.5 3.5 0 0 1 3.5 3.5v5a3.5 3.5 0 0 1-3.5 3.5H25v3l-4-3h-6.5a3.5 3.5 0 0 1-3.2-2.1c1-.2 1.8-.5 2.4-.9H21a4 4 0 0 0 4-4z"/></svg>
      <h1>Gupshup</h1>
      <p id="paneMsg">Pick a chat on the left, or start a new one.</p>
      <p class="fine">Everyone who opens this site and picks a name shows up under New chat. Share the link and start talking.</p>
    </div>

    <section class="thread" id="thread" hidden>
      <header class="thread-head">
        <button class="icon-btn back" id="backBtn" type="button" aria-label="Back to chats">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <div id="headAv"></div>
        <div class="head-text"><b id="headTitle"></b><span id="headSub"></span></div>
        <div class="grow"></div>
        <button class="icon-btn" id="exportBtn" type="button" aria-label="Download this chat" title="Download this chat" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7.5 11l4.5 4.5 4.5-4.5M5 20h14"/></svg>
        </button>
      </header>
      <div class="msgs" id="msgs" aria-live="polite"></div>
      <div class="selbar" id="selbar" hidden></div>
      <div class="topbar" id="replybar" hidden></div>
      <div class="topbar" id="attachbar" hidden></div>
      <div class="emoji" id="emoji" hidden></div>
      <form class="composer" id="composer" autocomplete="off">
        <button class="icon-btn" id="emojiBtn" type="button" aria-label="Emoji" title="Emoji">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.2a4.2 4.2 0 0 0 7 0"/><path d="M9 9.5h.01M15 9.5h.01" stroke-width="2.6"/></svg>
        </button>
        <button class="icon-btn" id="attachBtn" type="button" aria-label="Attach photo" title="Attach photo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11.5l-8 8a5 5 0 0 1-7-7l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7L9.7 17.2a1.7 1.7 0 0 1-2.4-2.4L15 7"/></svg>
        </button>
        <input type="file" id="file" accept="image/*" hidden>
        <textarea id="ta" rows="1" maxlength="4000" placeholder="Type a message" aria-label="Message"></textarea>
        <button class="send" id="send" type="submit" aria-label="Send" disabled>
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.4 20.4l17.4-7.5a1 1 0 0 0 0-1.8L3.4 3.6a.8.8 0 0 0-1.1.9L4 10.5l9 1.5-9 1.5-1.7 6a.8.8 0 0 0 1.1.9z"/></svg>
        </button>
      </form>
    </section>
  </main>

  <div class="scrim" id="sheet" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-head">
        <h2 id="sheetTitle">New chat</h2>
        <button class="icon-btn" id="sheetClose" type="button" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div id="sheetPick" style="display:flex;flex-direction:column;min-height:0">
        <div class="search"><input id="sheetQ" type="search" placeholder="Search people" autocomplete="off" aria-label="Search people"></div>
        <div class="sheet-list" id="sheetList"></div>
      </div>
      <form class="group-form" id="groupForm" hidden>
        <label for="groupName">Group name</label>
        <input id="groupName" maxlength="60" placeholder="Weekend plans" autocomplete="off">
        <button class="primary" id="groupGo" type="submit" disabled>Create group</button>
      </form>
    </div>
  </div>
</div>
<div class="scrim lightbox" id="lightbox" hidden>
  <img id="lbImg" alt="Photo">
  <div class="lb-actions">
    <button class="primary" id="lbSave" type="button">Download photo</button>
    <button class="chip" id="lbClose" type="button">Close</button>

    const r = S.rooms[room];
    if (r?.last?.id === m.id) await roomUpdate(room, { last: { ...r.last, text: '', deleted: true } });
  } catch (e) { writeError(e); }
  S.sel = null; renderThread();
}

/* ---------- replies, photos, typing, downloads ---------- */
const ICON_X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const canSend = () => S.canWrite && (!!$('#ta').value.trim() || !!S.img);
const snippet = (m) => m.deleted ? 'Deleted message' : (m.text ? m.text.slice(0, 120) : (m.img ? 'Photo' : ''));

function renderSub() {
  if (!S.active) return;
  const r = S.rooms[S.active] || { kind: 'group' };
  const typers = [...new Set((S.peers || []).filter((p) => !p.isMe && p.by && p.presence && p.presence.typing === S.active).map((p) => p.by))];
  const sub = $('#headSub');
  sub.classList.toggle('typing', typers.length > 0);
  if (typers.length) {
    loadProfiles(typers);
    sub.textContent = r.kind === 'dm' ? 'typing…' : typers.length === 1 ? name(typers[0]) + ' is typing…' : typers.length + ' people are typing…';
    return;
  }
  const n = Object.keys(S.people).length;
  sub.textContent = r.kind === 'dm' ? 'Direct chat' : `Open to everyone · ${n} ${n === 1 ? 'person' : 'people'}`;
}

function jumpTo(id) {
  const row = $('#msgs').querySelector(`[data-mid="${CSS.escape(id)}"]`);
  if (!row) { toast('That message is older than what is loaded.'); return; }
  row.scrollIntoView({ block: 'center', behavior: 'smooth' });
  row.classList.add('flash');
  setTimeout(() => row.classList.remove('flash'), 1400);
}
function startReply(m) {
  S.reply = { id: m.id, from: m.from, text: snippet(m) };
  S.sel = null; renderThread(); renderBars();
  if (!coarse) $('#ta').focus();
}
function renderBars() {
  const rb = $('#replybar');
  rb.hidden = !S.reply;
  if (S.reply) {
    rb.replaceChildren(
      el('div', { class: 'qt' }, el('b', { text: 'Replying to ' + (S.reply.from === S.me.id ? 'yourself' : name(S.reply.from)) }), el('span', { text: S.reply.text })),
      el('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Cancel reply', onclick: () => { S.reply = null; renderBars(); } }, svg(ICON_X)));
  }
  const ab = $('#attachbar');
  ab.hidden = !S.img;
  if (S.img) {
    ab.replaceChildren(
      el('img', { src: S.img.url, alt: 'Photo to send' }),
      el('div', { class: 'qt' }, el('b', { text: 'Photo ready to send' }), el('span', { text: 'Add a caption or just press send.' })),
      el('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Remove photo', onclick: () => { S.img = null; renderBars(); } }, svg(ICON_X)));
  }
  fit();
}

async function compress(file) {
  const bmp = await createImageBitmap(file);
  let max = 1024, q = 0.72;
  for (let i = 0; i < 7; i++) {
    const sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(bmp.width * sc));
    c.height = Math.max(1, Math.round(bmp.height * sc));
    const g = c.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
    g.drawImage(bmp, 0, 0, c.width, c.height);
    const url = c.toDataURL('image/jpeg', q);
    if (url.length <= 110000) return { url, w: c.width, h: c.height };
    max = Math.round(max * 0.8); q = Math.max(0.5, q - 0.05);
  }
  throw new Error('too big');
}

let lbMsg = null;
function openLightbox(m) {
  lbMsg = m; $('#lbImg').src = m.img; $('#lbSave').hidden = !S.dl;
  $('#lightbox').hidden = false;
}
function closeLightbox() { $('#lightbox').hidden = true; $('#lbImg').removeAttribute('src'); lbMsg = null; }
function dataUrlBlob(u) {
  const bin = atob(u.split(',')[1]); const a = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return new Blob([a], { type: 'image/jpeg' });
}
function dlError(e) {
  if (e && e.code === 'declined') return;
  toast('Saving files is not available here.');
}
async function savePhoto(m) {
  if (!S.dl || !m || !m.img) return;
  try { await S.dl.save({ filename: `gupshup-photo-${m.ts}.jpg`, data: dataUrlBlob(m.img) }); toast('Photo saved'); }
  catch (e) { dlError(e); }
  if (S.sel) { S.sel = null; renderThread(); }
}
async function exportChat() {
  if (!S.dl || !S.active) return;
  const r = S.rooms[S.active] || {};
  const lines = S.msgs.map((m) => {
    const d = new Date(m.ts);
    const stamp = d.toLocaleDateString([], { day: 'numeric', month: 'short', year: 'numeric' }) + ', ' + timeFmt.format(d);
    const body = m.deleted ? 'This message was deleted' : [m.img ? '[photo]' : '', m.text].filter(Boolean).join(' ');
    return `[${stamp}] ${name(m.from)}: ${body}`;
  });
  if (!lines.length) { toast('There are no messages to download yet.'); return; }
  const title = roomTitle(r).replace(/[^\w\- ]+/g, '').trim() || 'chat';
  const head = `Gupshup chat: ${roomTitle(r)}\nDownloaded ${new Date().toLocaleString()}\nLatest ${lines.length} messages\n\n`;
  try { await S.dl.save({ filename: `${title} chat.txt`, data: head + lines.join('\n') + '\n' }); toast('Chat saved'); }
  catch (e) { dlError(e); }
}

let typingTimer;
function setTyping(on) {
  clearTimeout(typingTimer);
  const v = on && S.active ? S.active : null;
  if (on) typingTimer = setTimeout(() => setTyping(false), 4000);
  if (!S.room || S.typingSent === v) return;
  S.typingSent = v;
  S.room.presence({ typing: v }).catch(() => {});
}

/* ---------- sheet ---------- */
function openSheet() {
  if (S.status !== 'ready') return;
  S.sheetQ = ''; $('#sheetQ').value = '';
  $('#sheetTitle').textContent = 'New chat';
  $('#sheetPick').hidden = false; $('#groupForm').hidden = true;
  $('#sheet').hidden = false;
  renderSheetList();
  if (!coarse) $('#sheetQ').focus();
}
function closeSheet() { $('#sheet').hidden = true; }
function renderSheetList() {
  if ($('#sheet').hidden) return;
  const box = $('#sheetList'); box.replaceChildren();
  box.append(el('button', { class: 'group-btn', type: 'button', onclick: showGroupForm },
    el('span', { class: 'av' }, svg(ICON_GROUP)), el('span', { text: 'New group' })));
  const q = S.sheetQ.trim().toLowerCase();
  const ids = Object.keys(S.people).filter((id) => id !== S.me.id);
  loadProfiles(ids);
  const list = ids.filter((id) => !q || name(id).toLowerCase().includes(q))
    .sort((a, b) => name(a).localeCompare(name(b)));
  box.append(el('h3', { text: 'People' }));
  if (!list.length) {
    box.append(el('div', { class: 'empty-list' }, el('p', { text: q ? 'No one matches that name.' : 'No one else has opened this page yet. Share it so friends can join.' })));
    return;
  }
  for (const id of list) {
    box.append(el('button', { class: 'row', type: 'button', onclick: () => { closeSheet(); openDM(id); } },
      personAvatar(id),
      el('div', { class: 'row-main' }, el('div', { class: 'row-top' }, el('b', { text: name(id) })))));
  }
}
function showGroupForm() {
  $('#sheetTitle').textContent = 'New group';
  $('#sheetPick').hidden = true; $('#groupForm').hidden = false;
  $('#groupName').value = ''; $('#groupGo').disabled = true;
  if (!coarse) $('#groupName').focus();
}

/* ---------- actions ---------- */
function saveDraft() { if (S.active) S.drafts[S.active] = $('#ta').value; }
function fit() {
  const ta = $('#ta');
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 140) + 'px';
  $('#send').disabled = !canSend();
}
function stopMsgs() { if (S.unsubMsgs) { S.unsubMsgs(); S.unsubMsgs = null; } }

function openRoom(id) {
  if (!S.db) return;
  stopMsgs(); saveDraft();
  S.active = id; S.msgs = []; S.sel = null; S.view = 'thread'; S.stick = true;
  setTyping(false); S.reply = null; S.img = null; renderBars();
  $('#ta').value = S.drafts[id] || '';
  $('#emoji').hidden = true;
  renderAll(); fit();
  S.unsubMsgs = S.db.collection(`rooms/${id}/messages`).orderBy('ts', 'desc').limit(100).onSnapshot((snap) => {
    if (S.active !== id) return;
    S.msgs = snap.docs.map((d) => ({ id: d.id, ...d.data(), pending: d.metadata.hasPendingWrites })).reverse();
    loadProfiles(S.msgs.map((m) => m.from));
    renderThread(); markRead();
  }, () => toast('Lost the connection to this chat. Reload the page.'));
  if (!coarse) $('#ta').focus();
}
function closeRoom() {
  stopMsgs(); saveDraft();
  S.active = null; S.msgs = []; S.sel = null; S.view = 'list';
  setTyping(false); S.reply = null; S.img = null; renderBars();
  renderAll();
}
async function openDM(other) {
  const ids = [S.me.id, other].sort();
  const id = 'dm-' + ids.join('-');
  if (!S.rooms[id]) {
    const data = { kind: 'dm', members: ids, createdAt: Date.now(), last: null };
    try {
      const ref = S.db.doc('rooms/' + id);
      const snap = await ref.get();
      if (!snap.exists) await ref.set(data);
      S.rooms[id] = snap.exists ? snap.data() : data;
    } catch (e) { writeError(e); return; }
  }
  openRoom(id);
}
async function createGroup() {
  const title = $('#groupName').value.trim().slice(0, 60);
  if (!title || !S.db) return;
  $('#groupGo').disabled = true;
  try {
    const ref = await S.db.collection('rooms').add({ kind: 'group', title, createdBy: S.me.id, createdAt: Date.now(), last: null });
    closeSheet();
    S.rooms[ref.id] = { kind: 'group', title, createdBy: S.me.id, createdAt: Date.now(), last: null };
    openRoom(ref.id);
  } catch (e) { $('#groupGo').disabled = false; writeError(e); }
}

function roomUpdate(id, data) {
  const p = (S.chain[id] || Promise.resolve()).then(() => S.db.doc('rooms/' + id).update(data));
  S.chain[id] = p.catch(() => {});
  return p;
}
async function send() {
  const ta = $('#ta');
  const text = ta.value.trim();
  const img = S.img, reply = S.reply;
  if ((!text && !img) || !S.active || !S.db || !S.canWrite) return;
  const room = S.active;
  const rec = { from: S.me.id, text, ts: Date.now() };
  if (img) { rec.img = img.url; rec.iw = img.w; rec.ih = img.h; }
  if (reply) rec.reply = reply;
  ta.value = ''; S.drafts[room] = ''; S.img = null; S.reply = null;
  renderBars(); setTyping(false); fit();
  S.stick = true;
  try {
    const ref = await S.db.collection(`rooms/${room}/messages`).add(rec);
    await roomUpdate(room, { last: { id: ref.id, text, from: S.me.id, ts: rec.ts, img: !!img, deleted: false } });
  } catch (e) {
    if (S.active === room && !ta.value && !S.img) { ta.value = text; S.img = img; S.reply = reply; renderBars(); fit(); }
    writeError(e);
  }
}
function markRead() {
  if (!S.db || !S.active || document.visibilityState === 'hidden') return;
  const id = S.active;
  const ts = S.rooms[id]?.last?.ts || 0;
  if (!ts || (S.reads[id] || 0) >= ts || (S.readWritten[id] || 0) >= ts) return;
  S.readWritten[id] = ts;
  const next = { ...S.reads, [id]: ts };
  S.db.doc(`data/users/${S.me.id}/state`).set({ reads: next }).catch(() => { S.readWritten[id] = 0; });
}
function writeError(e) {
  const code = e && e.code;
  if (code === 'invalid_argument' || code === 'permission-denied') {
    S.canWrite = false; renderComposer();
    toast('Sending was blocked. Check that your Firestore rules are published.');
  } else if (code === 'quota_exceeded' || code === 'resource-exhausted') toast('The database is full or over its limit. Check your Firebase usage.');
  else toast('That did not go through. Try again.');
}
let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 4200);
}

/* ---------- wiring ---------- */
$('#newBtn').addEventListener('click', openSheet);
$('#sheetClose').addEventListener('click', closeSheet);
$('#sheet').addEventListener('click', (e) => { if (e.target.id === 'sheet') closeSheet(); });
$('#sheetQ').addEventListener('input', (e) => { S.sheetQ = e.target.value; renderSheetList(); });
$('#q').addEventListener('input', (e) => { S.q = e.target.value; renderList(); });
$('#backBtn').addEventListener('click', closeRoom);
$('#groupName').addEventListener('input', (e) => { $('#groupGo').disabled = !e.target.value.trim(); });
$('#groupForm').addEventListener('submit', (e) => { e.preventDefault(); createGroup(); });
$('#composer').addEventListener('submit', (e) => { e.preventDefault(); send(); $('#ta').focus(); });
$('#ta').addEventListener('input', () => { fit(); saveDraft(); setTyping(!!$('#ta').value.trim()); });
$('#ta').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && !coarse) { e.preventDefault(); send(); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (!$('#lightbox').hidden) closeLightbox(); else if (!$('#sheet').hidden) closeSheet(); else if (S.sel) { S.sel = null; renderThread(); } } });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') markRead(); });

$('#attachBtn').addEventListener('click', () => $('#file').click());
$('#file').addEventListener('change', async (e) => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  if (!f.type.startsWith('image/')) { toast('Choose an image file.'); return; }
  try { S.img = await compress(f); renderBars(); }
  catch (err) { toast('That photo could not be prepared. Try a JPEG or PNG.'); }
});
$('#exportBtn').addEventListener('click', exportChat);
$('#lbSave').addEventListener('click', () => savePhoto(lbMsg));
$('#lbClose').addEventListener('click', closeLightbox);
$('#lightbox').addEventListener('click', (e) => { if (e.target.id === 'lightbox') closeLightbox(); });

const EMOJI ='😀 😂 🥹 😊 😍 😘 😎 🤔 😅 😭 😡 🥳 🙏 👍 👎 👏 🙌 💪 👋 🤝 ❤️ 🔥 ✨ 🎉 💯 ✅ ❌ 👀 🍕 ☕ 🌙 🌧️ 🚗 📍 📞 🎂 🎶 😴 🤗 😬 🤣 😉 🙈 💔 🌹 ⭐ 🍉 🏏'.split(' ');
$('#emoji').append(...EMOJI.map((em) => el('button', {
  type: 'button', text: em, 'aria-label': em,
  onclick: () => {
    const ta = $('#ta'); const a = ta.selectionStart ?? ta.value.length; const b = ta.selectionEnd ?? a;
    ta.value = ta.value.slice(0, a) + em + ta.value.slice(b);
    ta.selectionStart = ta.selectionEnd = a + em.length;
    fit(); saveDraft(); if (!coarse) ta.focus();
  },
})));
$('#emojiBtn').addEventListener('click', () => { const t = $('#emoji'); t.hidden = !t.hidden; });

/* ---------- connect ---------- */
function offline() {
  S.status = 'offline'; S.db = null;
  $('#paneMsg').textContent = 'Add your Firebase settings to turn chat on.';
  renderAll();
}
async function init() {
  renderAll();
  const c = window.claude;
  if (!c || typeof c.use !== 'function') return offline();
  let db, user;
  try { [db, user] = await Promise.all([c.use('db'), c.use('user')]); } catch (e) { return offline(); }
  if (!db || !user) return offline();
  S.db = db; S.user = user;
  S.meV = await user.me();
  S.me = { id: S.meV.id };
  if (!S.me.id) return offline();
  const cw = await user.can('data.write');
  S.canWrite = cw !== false;
  loadProfiles([S.me.id]);
  c.use('downloads').then((d) => { S.dl = d; $('#exportBtn').hidden = !d; renderSelbar(); }).catch(() => {});
  c.use('room').then((rm) => {
    if (!rm) return;
    S.room = rm;
    rm.onPeers((ch) => { S.peers = ch.peers; renderSub(); });
  }).catch(() => {});
  const fail = (e) => { S.status = 'error'; S.error = 'Live updates stopped. Reload the page.'; renderAll(); };

  db.collection('rooms').onSnapshot((snap) => {
    const o = {};
    snap.docs.forEach((d) => { o[d.id] = d.data(); });
    S.rooms = o; S.status = 'ready';
    const ids = [];
    Object.values(o).forEach((r) => { (r.members || []).forEach((m) => ids.push(m)); if (r.last) ids.push(r.last.from); });
    loadProfiles(ids);
    renderAll(); markRead();
  }, fail);
  db.collection('people').onSnapshot((snap) => {
    const o = {};
    snap.docs.forEach((d) => { o[d.id] = d.data(); });
    S.people = o;
    loadProfiles(Object.keys(o));
    renderThread(); renderSheetList();
  }, () => {});
  db.doc(`data/users/${S.me.id}/state`).onSnapshot((snap) => {
    S.reads = (snap.exists && snap.data().reads) || {};
    S.readsLoaded = true;
    renderList();
  }, () => { S.readsLoaded = true; });

  try {
    const pr = db.doc('people/' + S.me.id);
    const s = await pr.get();
    if (!s.exists && S.canWrite) await pr.set({ joinedAt: Date.now() });
  } catch (e) { /* joining the people list is best effort */ }
}
init();
})();
</script>
